<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Burn Ledger, an editorial timeline of verified Codex worker runs.">
  <title>The Burn Ledger</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3eddf;
      --paper-deep: #e7ddca;
      --ink: #24221e;
      --ink-soft: #6d685e;
      --gate: #c43b25;
      --training: #627159;
      --frame: #aca28f;
    }

    * { box-sizing: border-box; }

    html { background: #d8cfbe; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(60, 51, 39, .035) 1px, transparent 1px) 0 0 / 19px 19px,
        #d8cfbe;
      font-family: Georgia, "Times New Roman", serif;
    }

    .shell {
      width: min(96vw, 1680px);
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .utility {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
      border-top: 1px solid rgba(36, 34, 30, .72);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .utility-left { display: flex; align-items: center; gap: 18px; }
    .utility p { margin: 0; }

    .day-switcher { display: flex; gap: 4px; }
    .day-switcher a {
      padding: 3px 5px 2px;
      color: var(--ink-soft);
      text-decoration: none;
      border: 1px solid transparent;
    }
    .day-switcher a:hover,
    .day-switcher a:focus-visible { color: var(--ink); border-color: var(--ink); outline: none; }
    .day-switcher a[aria-current="date"] { color: var(--paper); background: var(--ink); }

    .export-button {
      appearance: none;
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: 10px 14px 9px;
      color: var(--paper);
      background: var(--ink);
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease;
    }

    .export-button:hover,
    .export-button:focus-visible {
      color: var(--ink);
      background: var(--paper);
      outline: none;
    }

    .export-button:disabled { cursor: wait; opacity: .7; }

    .chart-frame {
      position: relative;
      min-height: 300px;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid var(--frame);
      background: var(--paper);
      box-shadow: 0 16px 40px rgba(58, 48, 34, .12);
      scrollbar-color: var(--ink-soft) var(--paper-deep);
      scrollbar-width: thin;
      overscroll-behavior-inline: contain;
    }

    .chart-frame::-webkit-scrollbar { height: 10px; }
    .chart-frame::-webkit-scrollbar-track { background: var(--paper-deep); }
    .chart-frame::-webkit-scrollbar-thumb { background: var(--ink-soft); }

    #ledger {
      display: block;
      width: max(100%, 1680px);
      height: auto;
      background: var(--paper);
    }

    .tooltip {
      position: fixed;
      z-index: 10;
      width: min(310px, calc(100vw - 24px));
      padding: 11px 13px 12px;
      border: 1px solid var(--ink);
      color: var(--paper);
      background: var(--ink);
      box-shadow: 5px 5px 0 rgba(196, 59, 37, .8);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .tooltip[data-open="true"] { opacity: 1; transform: translateY(0); }
    .tooltip strong {
      display: block;
      margin-bottom: 4px;
      color: #f09a7f;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status {
      min-height: 16px;
      margin: 9px 2px 0;
      color: #514c43;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: .04em;
    }

    @media (max-width: 700px) {
      .shell { width: calc(100vw - 20px); padding-top: 10px; }
      .utility { align-items: flex-start; padding: 8px 0; }
      .utility-left { align-items: flex-start; flex-direction: column; gap: 5px; }
      .utility p { max-width: 20ch; line-height: 1.4; }
      .export-button { padding: 9px 10px 8px; }
      #ledger { width: 1680px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="utility" aria-label="Chart controls">
      <div class="utility-left">
        <p>Run ledger / 21 to 22 July 2026</p>
        <nav class="day-switcher" id="day-switcher" aria-label="Choose ledger day"></nav>
      </div>
      <button class="export-button" id="export" type="button" disabled>Export 2400px PNG</button>
    </div>

    <div class="chart-frame" id="frame" tabindex="0" aria-label="Scrollable timeline chart. Use horizontal scrolling on narrow screens.">
      <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
    </div>
    <div class="status" id="status" aria-live="polite">Loading ledger…</div>
  </main>

  <script type="module" src="render.js"></script>
</body>
</html>
